<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>발췌 이미지 만들기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  @font-face {
    font-family: 'KoPubWorld Batang';
    src: url('https://cdn.jsdelivr.net/gh/adrinerDP/font-kopubworld@master/fonts/KoPubWorld-Batang-Light.woff2') format('woff2');
    font-weight: 300;
    font-display: swap;
  }
  @font-face {
    font-family: 'KoPubWorld Batang';
    src: url('https://cdn.jsdelivr.net/gh/adrinerDP/font-kopubworld@master/fonts/KoPubWorld-Batang-Medium.woff') format('woff');
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: 'KoPubWorld Batang';
    src: url('https://cdn.jsdelivr.net/gh/adrinerDP/font-kopubworld@master/fonts/KoPubWorld-Batang-Bold.woff') format('woff');
    font-weight: 700;
    font-display: swap;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Pretendard Variable', -apple-system, sans-serif;
    background: #ffffff;
    color: #111;
  }

  header {
    padding: 20px 24px 12px;
    font-size: 13px;
    color: #999;
    letter-spacing: 0.02em;
  }

  main {
    display: flex;
    flex-direction: column;
    max-width: 1300px;
    margin: 0 auto;
  }

  /* ===== 미리보기 영역 ===== */
  #previewCol {
    order: 0;
    background: #efefef;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    gap: 16px;
  }

  #canvasWrap {
    border: 1px solid #ddd;
    line-height: 0;
    background: #fff;
  }

  canvas {
    display: block;
    max-width: 100%;
    height: auto;
  }

  #pageNav {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 13px;
    color: #555;
  }

  #pageNav button {
    border: 1px solid #ccc;
    background: #fff;
    color: #333;
    padding: 6px 12px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
  }

  #pageNav button:disabled {
    opacity: 0.35;
    cursor: default;
  }

  /* ===== 설정 패널 ===== */
  #panelCol {
    order: 1;
    padding: 28px 24px 60px;
  }

  .panel { width: 100%; max-width: 460px; margin: 0 auto; }

  @media (min-width: 900px) {
    main { flex-direction: row; align-items: stretch; }
    #previewCol { order: 0; flex: 1; padding: 40px; }
    #panelCol {
      order: 1;
      width: 400px;
      flex-shrink: 0;
      border-left: 1px solid #eee;
      padding: 28px 28px 60px;
    }
    .panel { max-width: none; }
  }

  .field { margin-bottom: 18px; }

  .field label {
    display: block;
    margin-bottom: 6px;
    font-size: 12px;
    color: #777;
    letter-spacing: 0.02em;
  }

  .field input[type=text],
  .field textarea,
  .field select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    background: #fff;
    color: #111;
    font-size: 14px;
    font-family: inherit;
    border-radius: 0;
  }

  .field textarea { height: 70px; resize: vertical; }

  .field select {
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, #999 50%), linear-gradient(135deg, #999 50%, transparent 50%);
    background-position: calc(100% - 18px) center, calc(100% - 13px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    cursor: pointer;
  }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

  .field input[type=color] {
    width: 100%;
    height: 38px;
    border: 1px solid #ddd;
    padding: 2px;
    background: #fff;
    cursor: pointer;
  }

  .field input[type=range] { width: 100%; accent-color: #111; }

  .toggle-btn {
    padding: 10px 0;
    border: 1px solid #ddd;
    background: #fff;
    color: #444;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    text-align: center;
  }

  .toggle-btn.active { background: #111; color: #fff; border-color: #111; }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .checkbox-row input { accent-color: #111; width: 16px; height: 16px; }
  .checkbox-row label { font-size: 12px; color: #777; margin: 0; }

  hr.sep { border: none; border-top: 1px solid #eee; margin: 24px 0; }

  .section-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: #111;
    margin-bottom: 14px;
  }

  button#downloadBtn {
    width: 100%;
    padding: 14px;
    border: 1px solid #111;
    border-radius: 0;
    background: #111;
    color: #fff;
    font-size: 14px;
    letter-spacing: 0.02em;
    cursor: pointer;
    font-family: inherit;
    margin-top: 8px;
  }

  button#downloadBtn:hover { background: #fff; color: #111; }
</style>
</head>
<body>

<header>by @7ucky</header>

<main>

  <div id="previewCol">
    <div id="canvasWrap">
      <canvas id="canvas" width="800" height="1000"></canvas>
    </div>
    <div id="pageNav">
      <button id="prevBtn">&larr; 이전</button>
      <span id="pageIndicator">1 / 1</span>
      <button id="nextBtn">다음 &rarr;</button>
    </div>
  </div>

  <div id="panelCol">
    <div class="panel">

      <div class="section-title">캔버스</div>

      <div class="field">
        <label>비율 (가로 800px 고정)</label>
        <select id="ratio">
          <option value="4:5">4 : 5</option>
          <option value="3:4">3 : 4</option>
        </select>
      </div>

      <div class="row2">
        <div class="field">
          <label>위·아래 여백 (<span id="marginYVal">60</span>px)</label>
          <input type="range" id="marginY" min="0" max="200" value="60">
        </div>
        <div class="field">
          <label>양쪽 여백 (<span id="marginXVal">60</span>px)</label>
          <input type="range" id="marginX" min="0" max="200" value="60">
        </div>
      </div>

      <hr class="sep">
      <div class="section-title">본문</div>

      <div class="field">
        <label>인용구 (길면 자동으로 다음 페이지로 넘어감)</label>
        <textarea id="quote">시작이 반이다. 무엇이든 시작하는 순간, 이미 절반은 이루어진 것이다.</textarea>
      </div>

      <div class="field">
        <label>폰트</label>
        <select id="fontFamily">
          <option value="'Pretendard Variable', sans-serif">Pretendard Variable</option>
          <option value="'KoPubWorld Batang', serif">KoPub World 바탕체</option>
        </select>
      </div>

      <div class="row2">
        <div class="field">
          <label>스타일</label>
          <div class="row2">
            <div class="toggle-btn" id="boldBtn">B 볼드체</div>
            <div class="toggle-btn" id="italicBtn"><i>I</i> 기울임</div>
          </div>
        </div>
        <div class="field">
          <label>정렬</label>
          <select id="align">
            <option value="left">왼쪽</option>
            <option value="center" selected>가운데</option>
            <option value="right">오른쪽</option>
            <option value="justify">양쪽 정렬</option>
          </select>
        </div>
      </div>

      <div class="row2">
        <div class="field">
          <label>배경색</label>
          <input type="color" id="bgColor" value="#ffffff">
        </div>
        <div class="field">
          <label>글자색</label>
          <input type="color" id="textColor" value="#000000">
        </div>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="highlightOn">
        <label for="highlightOn">형광펜 효과</label>
      </div>
      <div class="field">
        <label>형광펜 색</label>
        <input type="color" id="highlightColor" value="#fff176">
      </div>

      <div class="field">
        <label>글자 크기 (<span id="fontSizeVal">14</span>px)</label>
        <input type="range" id="fontSize" min="10" max="90" value="14">
      </div>

      <div class="row2">
        <div class="field">
          <label>자간 (<span id="letterSpacingVal">0</span>px)</label>
          <input type="range" id="letterSpacing" min="-3" max="20" value="0">
        </div>
        <div class="field">
          <label>줄간격 (<span id="lineHeightVal">140</span>%)</label>
          <input type="range" id="lineHeight" min="100" max="220" value="140">
        </div>
      </div>

      <hr class="sep">
      <div class="section-title">출처 (마지막 페이지 하단 우측 고정)</div>

      <div class="field">
        <label>출처 / 이름</label>
        <input type="text" id="source" value="- 아리스토텔레스 -">
      </div>

      <div class="row2">
        <div class="field">
          <label>글자 크기 (<span id="sourceFontSizeVal">13</span>px)</label>
          <input type="range" id="sourceFontSize" min="8" max="40" value="13">
        </div>
        <div class="field">
          <label>글자색</label>
          <input type="color" id="sourceColor" value="#666666">
        </div>
      </div>

      <button id="downloadBtn">현재 페이지 이미지로 저장</button>
    </div>
  </div>

</main>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const el = id => document.getElementById(id);
const quoteEl = el('quote');
const sourceEl = el('source');
const bgColorEl = el('bgColor');
const textColorEl = el('textColor');
const fontSizeEl = el('fontSize');
const fontSizeVal = el('fontSizeVal');
const fontFamilyEl = el('fontFamily');
const alignEl = el('align');
const boldBtn = el('boldBtn');
const italicBtn = el('italicBtn');
const highlightOnEl = el('highlightOn');
const highlightColorEl = el('highlightColor');
const letterSpacingEl = el('letterSpacing');
const letterSpacingVal = el('letterSpacingVal');
const lineHeightEl = el('lineHeight');
const lineHeightVal = el('lineHeightVal');
const sourceFontSizeEl = el('sourceFontSize');
const sourceFontSizeVal = el('sourceFontSizeVal');
const sourceColorEl = el('sourceColor');
const ratioEl = el('ratio');
const marginYEl = el('marginY');
const marginYVal = el('marginYVal');
const marginXEl = el('marginX');
const marginXVal = el('marginXVal');
const prevBtn = el('prevBtn');
const nextBtn = el('nextBtn');
const pageIndicator = el('pageIndicator');

let bold = false;
let italic = false;
let currentPage = 0;

boldBtn.addEventListener('click', () => { bold = !bold; boldBtn.classList.toggle('active', bold); update(); });
italicBtn.addEventListener('click', () => { italic = !italic; italicBtn.classList.toggle('active', italic); update(); });

ratioEl.addEventListener('change', () => {
  const [w, h] = ratioEl.value.split(':').map(Number);
  canvas.width = 800;
  canvas.height = Math.round(800 * (h / w));
  update();
});

prevBtn.addEventListener('click', () => { currentPage = Math.max(0, currentPage - 1); draw(); });
nextBtn.addEventListener('click', () => { currentPage += 1; draw(); });

function buildFont(sizePx, family) {
  return `${italic ? 'italic ' : ''}${bold ? 'bold ' : ''}${sizePx}px ${family}`;
}

function measureLineWidth(ctx, text, spacing) {
  let w = 0;
  for (const ch of text) w += ctx.measureText(ch).width + spacing;
  if (text.length > 0) w -= spacing;
  return w;
}

function wrapText(ctx, text, maxWidth, spacing) {
  const paragraphs = text.split('\n');
  const lines = [];
  paragraphs.forEach((para, pi) => {
    const words = para.split(' ');
    let line = '';
    words.forEach(word => {
      const test = line ? line + ' ' + word : word;
      if (measureLineWidth(ctx, test, spacing) > maxWidth && line) {
        lines.push(line);
        line = word;
      } else {
        line = test;
      }
    });
    lines.push(line);
  });
  return lines;
}

// 한 글자씩 정확한 위치에 그리기 (자간 반영), x는 텍스트 시작 지점(왼쪽)
function drawCharsFrom(ctx, text, x, y, spacing) {
  const prevAlign = ctx.textAlign;
  ctx.textAlign = 'left';
  let cx = x;
  for (const ch of text) {
    ctx.fillText(ch, cx, y);
    cx += ctx.measureText(ch).width + spacing;
  }
  ctx.textAlign = prevAlign;
}

// 정렬 방식에 따라 한 줄의 시작 x좌표 계산 후 그리기. 형광펜용 박스 정보도 반환.
function layoutLine(ctx, line, alignment, boxLeft, boxRight, spacing, isLastLine) {
  const contentWidth = boxRight - boxLeft;
  const lineWidth = measureLineWidth(ctx, line, spacing);

  if (alignment === 'justify' && !isLastLine) {
    const words = line.split(' ');
    if (words.length > 1) {
      const wordsWidth = words.reduce((s, w) => s + measureLineWidth(ctx, w, spacing), 0);
      const gapWidth = (contentWidth - wordsWidth) / (words.length - 1);
      return { draw: (y) => {
        let x = boxLeft;
        words.forEach(w => {
          drawCharsFrom(ctx, w, x, y, spacing);
          x += measureLineWidth(ctx, w, spacing) + gapWidth;
        });
      }, boxX: boxLeft, boxW: contentWidth };
    }
  }

  let startX;
  if (alignment === 'left' || alignment === 'justify') startX = boxLeft;
  else if (alignment === 'right') startX = boxRight - lineWidth;
  else startX = boxLeft + (contentWidth - lineWidth) / 2;

  return { draw: (y) => drawCharsFrom(ctx, line, startX, y, spacing), boxX: startX, boxW: lineWidth };
}

function update() { currentPage = 0; draw(); }

function draw() {
  const W = canvas.width, H = canvas.height;
  const bg = bgColorEl.value;
  const textColor = textColorEl.value;
  const fontSize = parseInt(fontSizeEl.value, 10);
  const fontFamily = fontFamilyEl.value;
  const spacing = parseInt(letterSpacingEl.value, 10);
  const lineHeightPct = parseInt(lineHeightEl.value, 10);
  const sourceFontSize = parseInt(sourceFontSizeEl.value, 10);
  const marginY = parseInt(marginYEl.value, 10);
  const marginX = parseInt(marginXEl.value, 10);
  const alignment = alignEl.value;

  fontSizeVal.textContent = fontSize;
  letterSpacingVal.textContent = spacing;
  lineHeightVal.textContent = lineHeightPct;
  sourceFontSizeVal.textContent = sourceFontSize;
  marginYVal.textContent = marginY;
  marginXVal.textContent = marginX;

  const boxLeft = marginX;
  const boxRight = W - marginX;
  const contentWidth = boxRight - boxLeft;

  ctx.font = buildFont(fontSize, fontFamily);
  const lines = wrapText(ctx, quoteEl.value, contentWidth, spacing);
  const lineHeight = fontSize * (lineHeightPct / 100);

  const sourceReserve = sourceFontSize * 2.2;
  const availableHeight = Math.max(lineHeight, H - marginY * 2 - sourceReserve);
  const linesPerPage = Math.max(1, Math.floor(availableHeight / lineHeight));
  const totalPages = Math.max(1, Math.ceil(lines.length / linesPerPage));

  if (currentPage > totalPages - 1) currentPage = totalPages - 1;
  if (currentPage < 0) currentPage = 0;

  pageIndicator.textContent = `${currentPage + 1} / ${totalPages}`;
  prevBtn.disabled = currentPage === 0;
  nextBtn.disabled = currentPage >= totalPages - 1;

  const pageLines = lines.slice(currentPage * linesPerPage, (currentPage + 1) * linesPerPage);
  const isLastPage = currentPage === totalPages - 1;

  // 배경
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 줄별 레이아웃 계산 (위쪽 정렬로 흐르는 방식)
  ctx.font = buildFont(fontSize, fontFamily);
  const layouts = pageLines.map((line, i) => {
    const isLastLineOfQuote = (currentPage * linesPerPage + i) === lines.length - 1;
    return layoutLine(ctx, line, alignment, boxLeft, boxRight, spacing, isLastLineOfQuote);
  });

  const startY = marginY + lineHeight / 2;

  // 형광펜 (텍스트보다 먼저)
  if (highlightOnEl.checked) {
    ctx.fillStyle = highlightColorEl.value;
    ctx.globalAlpha = 0.55;
    const padY = fontSize * 0.12;
    layouts.forEach((L, i) => {
      const y = startY + i * lineHeight;
      ctx.fillRect(L.boxX - 6, y - lineHeight / 2 + padY, L.boxW + 12, lineHeight - padY * 2);
    });
    ctx.globalAlpha = 1;
  }

  // 본문
  ctx.fillStyle = textColor;
  ctx.textBaseline = 'middle';
  layouts.forEach((L, i) => L.draw(startY + i * lineHeight));

  // 출처 - 마지막 페이지 하단 우측 고정
  if (isLastPage) {
    ctx.font = buildFont(sourceFontSize, fontFamily);
    ctx.fillStyle = sourceColorEl.value;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(sourceEl.value, boxRight, H - marginY);
  }
}

[quoteEl, bgColorEl, textColorEl, fontSizeEl, fontFamilyEl, alignEl,
 highlightOnEl, highlightColorEl, letterSpacingEl, lineHeightEl,
 marginYEl, marginXEl].forEach(node => {
  node.addEventListener('input', update);
  node.addEventListener('change', update);
});

[sourceEl, sourceFontSizeEl, sourceColorEl].forEach(node => {
  node.addEventListener('input', draw);
  node.addEventListener('change', draw);
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = `quote-page${currentPage + 1}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
});

// 웹폰트를 실제로 미리 로드한 뒤 그려야 캔버스에 정확히 반영됨
async function loadFontsAndDraw() {
  try {
    await Promise.all([
      document.fonts.load("400 16px 'Pretendard Variable'"),
      document.fonts.load("700 16px 'Pretendard Variable'"),
      document.fonts.load("400 16px 'KoPubWorld Batang'"),
      document.fonts.load("700 16px 'KoPubWorld Batang'"),
    ]);
  } catch (e) {
    console.warn('font load issue', e);
  }
  draw();
}
loadFontsAndDraw();
</script>

</body>
</html>
