<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>i'm feeling @7ucky!</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  @font-face {
    font-family: 'KoPubWorld Batang';
    src: url('./fonts/KoPub Batang_Pro Light.otf') format('opentype');
    font-weight: 300;
    font-display: swap;
  }
  @font-face {
    font-family: 'KoPubWorld Batang';
    src: url('./fonts/KoPub Batang_Pro Medium.otf') format('opentype');
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: 'KoPubWorld Batang';
    src: url('./fonts/KoPub Batang_Pro Bold.otf') format('opentype');
    font-weight: 700;
    font-display: swap;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Pretendard Variable', -apple-system, sans-serif;
    background: #efefef;
    color: #111;
  }

  header {
    padding: 20px 24px 12px;
    font-size: 13px;
    color: #999;
    letter-spacing: 0.02em;
  }

  main {
    display: flex;
    flex-direction: column;
    max-width: 1300px;
    margin: 0 auto;
  }

  #previewCol {
    order: 0;
    background: #efefef;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 60px 20px 40px;
    gap: 16px;
  }

  #canvasWrap {
    border: 1px solid #ddd;
    line-height: 0;
    background: #fff;
  }

  canvas {
    display: block;
    max-width: 520px;
    max-height: 82vh;
    width: auto;
    height: auto;
  }

  #pageNav {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 13px;
    color: #555;
  }

  #pageNav button {
    border: 1px solid #ccc;
    background: #fff;
    color: #333;
    padding: 6px 12px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
  }

  #pageNav button:disabled { opacity: 0.35; cursor: default; }

  #panelCol { order: 1; padding: 28px 24px 60px; background: #fff; }

  .panel { width: 100%; max-width: 460px; margin: 0 auto; }

  @media (min-width: 900px) {
    main { flex-direction: row; align-items: stretch; }
    #previewCol { order: 0; flex: 1; padding: 40px; }
    #panelCol {
      order: 1;
      width: 400px;
      flex-shrink: 0;
      border-left: 1px solid #eee;
      padding: 28px 28px 60px;
    }
    .panel { max-width: none; }
  }

  .field { margin-bottom: 18px; }

  .field label {
    display: block;
    margin-bottom: 6px;
    font-size: 12px;
    color: #777;
    letter-spacing: 0.02em;
  }

  .field input[type=text],
  .field textarea,
  .field select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    background: #fff;
    color: #111;
    font-size: 14px;
    font-family: inherit;
    border-radius: 0;
  }

  .field textarea { height: 90px; resize: vertical; }

  .field select {
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, #999 50%), linear-gradient(135deg, #999 50%, transparent 50%);
    background-position: calc(100% - 18px) center, calc(100% - 13px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    cursor: pointer;
  }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .field input[type=color] {
    width: 100%;
    height: 38px;
    border: 1px solid #ddd;
    padding: 2px;
    background: #fff;
    cursor: pointer;
  }

  .swatches { display: flex; gap: 8px; margin-top: 8px; }
  .swatch {
    width: 28px;
    height: 28px;
    border: 1px solid #ddd;
    cursor: pointer;
    padding: 0;
  }

  .field input[type=range] { width: 100%; accent-color: #111; }

  .toggle-btn {
    padding: 10px 0;
    border: 1px solid #ddd;
    background: #fff;
    color: #444;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    text-align: center;
  }

  .toggle-btn.active { background: #111; color: #fff; border-color: #111; }

  hr.sep { border: none; border-top: 1px solid #eee; margin: 24px 0; }

  .section-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: #111;
    margin-bottom: 14px;
  }

  .hint {
    font-size: 11px;
    color: #aaa;
    margin: -4px 0 8px;
  }

  .editor-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }

  .tbtn {
    padding: 6px 10px;
    border: 1px solid #ccc;
    background: #fff;
    color: #333;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    border-radius: 0;
  }

  .tbtn:hover { background: #f2f2f2; }
  .tbtn.danger { color: #b33; border-color: #e0b3b3; }

  .editor-preview {
    border: 1px solid #ddd;
    background: #fff;
    padding: 10px 12px;
    min-height: 56px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    color: #111;
  }

  button#downloadBtn {
    width: 100%;
    padding: 14px;
    border: 1px solid #111;
    border-radius: 0;
    background: #111;
    color: #fff;
    font-size: 14px;
    letter-spacing: 0.02em;
    cursor: pointer;
    font-family: inherit;
    margin-top: 8px;
  }

  button#downloadBtn:hover { background: #fff; color: #111; }
</style>
</head>
<body>

<header>by @7ucky</header>

<main>

  <div id="previewCol">
    <div id="canvasWrap">
      <canvas id="canvas" width="800" height="1000"></canvas>
    </div>
    <div id="pageNav">
      <button id="prevBtn">&larr; 이전</button>
      <span id="pageIndicator">1 / 1</span>
      <button id="nextBtn">다음 &rarr;</button>
    </div>
  </div>

  <div id="panelCol">
    <div class="panel">

      <div class="section-title">캔버스</div>

      <div class="field">
        <label>비율 (가로 800px 고정)</label>
        <select id="ratio">
          <option value="4:5">4 : 5</option>
          <option value="3:4">3 : 4</option>
        </select>
      </div>

      <div class="row2">
        <div class="field">
          <label>위·아래 여백 (<span id="marginYVal">60</span>px)</label>
          <input type="range" id="marginY" min="0" max="200" step="5" value="60">
        </div>
        <div class="field">
          <label>양쪽 여백 (<span id="marginXVal">60</span>px)</label>
          <input type="range" id="marginX" min="0" max="200" step="5" value="60">
        </div>
      </div>

      <div class="field">
        <label>배경색</label>
        <input type="color" id="bgColor" value="#ffffff">
      </div>

      <hr class="sep">
      <div class="section-title">본문 — 기본값</div>

      <div class="field">
        <label>기본 폰트</label>
        <select id="fontFamily">
          <option value="pretendard">Pretendard Variable</option>
          <option value="kopub">KoPub World 바탕체</option>
        </select>
      </div>

      <div class="row2">
        <div class="field">
          <label>굵기</label>
          <select id="weight">
            <option value="thin">Thin</option>
            <option value="regular" selected>Regular</option>
            <option value="bold">Bold</option>
          </select>
        </div>
        <div class="field">
          <label>정렬</label>
          <select id="align">
            <option value="left" selected>왼쪽</option>
            <option value="center">가운데</option>
            <option value="right">오른쪽</option>
            <option value="justify">양쪽 정렬</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>기본 글자색</label>
        <input type="color" id="textColor" value="#000000">
      </div>

      <div class="field">
        <label>글자 크기 (<span id="fontSizeVal">16</span>px)</label>
        <input type="range" id="fontSize" min="10" max="90" value="16">
      </div>

      <div class="row2">
        <div class="field">
          <label>자간 (<span id="letterSpacingVal">0</span>px)</label>
          <input type="range" id="letterSpacing" min="-2" max="2" step="0.1" value="0">
        </div>
        <div class="field">
          <label>줄간격 (<span id="lineHeightVal">140</span>%)</label>
          <input type="range" id="lineHeight" min="100" max="220" value="140">
        </div>
      </div>

      <hr class="sep">
      <div class="section-title">인용구 — 부분 편집</div>
      <div class="hint">텍스트를 드래그로 선택한 뒤 버튼을 눌러 선택 영역에만 적용하세요.</div>

      <div class="editor-toolbar">
        <button type="button" class="tbtn" id="tbBold"><b>B</b> 볼드</button>
        <button type="button" class="tbtn" id="tbItalic"><i>I</i> 이탤릭</button>
        <button type="button" class="tbtn" id="tbUnderline"><u>U</u> 밑줄</button>
        <button type="button" class="tbtn" id="tbHiOn">형광펜 적용</button>
        <button type="button" class="tbtn" id="tbHiOff">형광펜 해제</button>
        <button type="button" class="tbtn" id="tbFontPretendard">Pretendard로</button>
        <button type="button" class="tbtn" id="tbFontKopub">KoPub으로</button>
        <button type="button" class="tbtn" id="tbFontReset">폰트 기본값</button>
        <button type="button" class="tbtn danger" id="tbClear">서식 초기화</button>
      </div>

      <div class="field">
        <label>적용된 서식 미리보기</label>
        <div id="editorPreview" class="editor-preview"></div>
      </div>

      <div class="field">
        <textarea id="quote">시작이 반이다. 무엇이든 시작하는 순간, 이미 절반은 이루어진 것이다.</textarea>
      </div>

      <div class="field">
        <label>형광펜 색상 (위 "형광펜 적용" 버튼에 사용됨)</label>
        <input type="color" id="highlightColor" value="#fff176">
        <div class="swatches">
          <button type="button" class="swatch" data-color="#FFEDFA" style="background:#FFEDFA"></button>
          <button type="button" class="swatch" data-color="#DEF9FF" style="background:#DEF9FF"></button>
          <button type="button" class="swatch" data-color="#FDFFDB" style="background:#FDFFDB"></button>
          <button type="button" class="swatch" data-color="#DFFFDB" style="background:#DFFFDB"></button>
        </div>
      </div>

      <hr class="sep">
      <div class="section-title">출처 (마지막 페이지 하단 우측 고정)</div>

      <div class="field">
        <label>출처 / 이름</label>
        <input type="text" id="source" value="- 아리스토텔레스 -">
      </div>

      <div class="row2">
        <div class="field">
          <label>글자 크기 (<span id="sourceFontSizeVal">13</span>px)</label>
          <input type="range" id="sourceFontSize" min="8" max="40" value="13">
        </div>
        <div class="field">
          <label>글자색</label>
          <input type="color" id="sourceColor" value="#666666">
        </div>
      </div>

      <button id="downloadBtn">현재 페이지 이미지로 저장</button>
    </div>
  </div>

</main>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const el = id => document.getElementById(id);

const quoteEl = el('quote');
const sourceEl = el('source');
const bgColorEl = el('bgColor');
const textColorEl = el('textColor');
const fontSizeEl = el('fontSize');
const fontSizeVal = el('fontSizeVal');
const fontFamilyEl = el('fontFamily');
const weightEl = el('weight');
const alignEl = el('align');
const highlightColorEl = el('highlightColor');
const letterSpacingEl = el('letterSpacing');
const letterSpacingVal = el('letterSpacingVal');
const lineHeightEl = el('lineHeight');
const lineHeightVal = el('lineHeightVal');
const sourceFontSizeEl = el('sourceFontSize');
const sourceFontSizeVal = el('sourceFontSizeVal');
const sourceColorEl = el('sourceColor');
const ratioEl = el('ratio');
const marginYEl = el('marginY');
const marginYVal = el('marginYVal');
const marginXEl = el('marginX');
const marginXVal = el('marginXVal');
const prevBtn = el('prevBtn');
const nextBtn = el('nextBtn');
const pageIndicator = el('pageIndicator');

const FONT_DEFS = {
  pretendard: { css: "'Pretendard Variable', sans-serif", weights: { thin: 100, regular: 400, bold: 700 } },
  kopub:      { css: "'KoPubWorld Batang', serif",         weights: { thin: 300, regular: 400, bold: 700 } }
};

let currentPage = 0;

// ---- 텍스트 + 글자별 서식 데이터 모델 ----
function makeDefaultFormat() { return { bold: false, italic: false, underline: false, highlightColor: null, font: null }; }

let text = quoteEl.value;
let formats = Array.from({ length: text.length }, makeDefaultFormat);

// 텍스트가 바뀌었을 때, 서식 배열을 최대한 그대로 유지하면서 길이만 맞춰줌
function syncFormatsWithText(newText) {
  const oldText = text;
  let p = 0;
  const maxP = Math.min(oldText.length, newText.length);
  while (p < maxP && oldText[p] === newText[p]) p++;

  let s = 0;
  const maxS = Math.min(oldText.length - p, newText.length - p);
  while (s < maxS && oldText[oldText.length - 1 - s] === newText[newText.length - 1 - s]) s++;

  const newMiddleLen = newText.length - p - s;
  formats = formats.slice(0, p)
    .concat(Array.from({ length: newMiddleLen }, makeDefaultFormat))
    .concat(formats.slice(oldText.length - s));
  text = newText;
}

function buildCharFont(idx, sizePx) {
  const fmt = formats[idx] || {};
  const familyKey = fmt.font || fontFamilyEl.value;
  const def = FONT_DEFS[familyKey];
  const weightLabel = weightEl.value;
  const weight = fmt.bold ? def.weights.bold : def.weights[weightLabel];
  return `${fmt.italic ? 'italic ' : ''}${weight} ${sizePx}px ${def.css}`;
}

function sameFormat(a, b) {
  return a.bold === b.bold && a.italic === b.italic && a.underline === b.underline
    && a.highlightColor === b.highlightColor && a.font === b.font;
}

function renderEditorPreview() {
  const container = el('editorPreview');
  container.innerHTML = '';
  let i = 0;
  while (i < text.length) {
    if (text[i] === '\n') {
      container.appendChild(document.createElement('br'));
      i++;
      continue;
    }
    const fmt = formats[i];
    let j = i;
    while (j < text.length && text[j] !== '\n' && sameFormat(formats[j], fmt)) j++;
    const span = document.createElement('span');
    span.textContent = text.slice(i, j);
    if (fmt.bold) span.style.fontWeight = '700';
    if (fmt.italic) span.style.fontStyle = 'italic';
    if (fmt.underline) span.style.textDecoration = 'underline';
    if (fmt.highlightColor) span.style.backgroundColor = fmt.highlightColor;
    const familyKey = fmt.font || fontFamilyEl.value;
    span.style.fontFamily = FONT_DEFS[familyKey].css;
    container.appendChild(span);
    i = j;
  }
}

document.querySelectorAll('.swatch').forEach(btn => {
  btn.addEventListener('click', () => { highlightColorEl.value = btn.dataset.color; });
});

ratioEl.addEventListener('change', () => {
  const [w, h] = ratioEl.value.split(':').map(Number);
  canvas.width = 800;
  canvas.height = Math.round(800 * (h / w));
  currentPage = 0;
  draw();
});

prevBtn.addEventListener('click', () => { currentPage = Math.max(0, currentPage - 1); draw(); });
nextBtn.addEventListener('click', () => { currentPage += 1; draw(); });

// ---- 부분 편집 툴바 ----
function selectionAllTrue(start, end, predicate) {
  if (start >= end) return false;
  for (let i = start; i < end; i++) if (!predicate(formats[i])) return false;
  return true;
}

function applyToSelection(mutator) {
  const start = quoteEl.selectionStart;
  const end = quoteEl.selectionEnd;
  if (start === end) return;
  for (let i = start; i < end; i++) mutator(formats[i]);
  draw();
  quoteEl.focus();
  quoteEl.setSelectionRange(start, end);
}

el('tbBold').addEventListener('click', () => {
  const start = quoteEl.selectionStart, end = quoteEl.selectionEnd;
  if (start === end) return;
  const allBold = selectionAllTrue(start, end, f => f.bold);
  applyToSelection(f => { f.bold = !allBold; });
});

el('tbItalic').addEventListener('click', () => {
  const start = quoteEl.selectionStart, end = quoteEl.selectionEnd;
  if (start === end) return;
  const allItalic = selectionAllTrue(start, end, f => f.italic);
  applyToSelection(f => { f.italic = !allItalic; });
});

el('tbUnderline').addEventListener('click', () => {
  const start = quoteEl.selectionStart, end = quoteEl.selectionEnd;
  if (start === end) return;
  const allUnderline = selectionAllTrue(start, end, f => f.underline);
  applyToSelection(f => { f.underline = !allUnderline; });
});

el('tbHiOn').addEventListener('click', () => {
  const color = highlightColorEl.value;
  applyToSelection(f => { f.highlightColor = color; });
});

el('tbHiOff').addEventListener('click', () => {
  applyToSelection(f => { f.highlightColor = null; });
});

el('tbFontPretendard').addEventListener('click', () => {
  applyToSelection(f => { f.font = 'pretendard'; });
});

el('tbFontKopub').addEventListener('click', () => {
  applyToSelection(f => { f.font = 'kopub'; });
});

el('tbFontReset').addEventListener('click', () => {
  applyToSelection(f => { f.font = null; });
});

el('tbClear').addEventListener('click', () => {
  applyToSelection(f => { f.bold = false; f.italic = false; f.underline = false; f.highlightColor = null; f.font = null; });
});

quoteEl.addEventListener('input', () => {
  syncFormatsWithText(quoteEl.value);
  currentPage = 0;
  draw();
});

// ---- 줄바꿈 (글자별 서식을 반영해 폭을 측정) ----
function wrapParagraph(ctx, paraStr, paraStartIdx, maxWidth, spacing, fontSize) {
  const wordsRaw = [];
  let wStart = 0;
  for (let i = 0; i <= paraStr.length; i++) {
    if (i === paraStr.length || paraStr[i] === ' ') {
      wordsRaw.push({ str: paraStr.slice(wStart, i), startIdx: paraStartIdx + wStart });
      wStart = i + 1;
    }
  }

  function charWidth(idx, ch) {
    ctx.font = buildCharFont(idx, fontSize);
    return ctx.measureText(ch).width;
  }

  const outLines = [];
  let curChars = [];
  let curWidth = 0;

  wordsRaw.forEach((w) => {
    let wordWidth = 0;
    for (let k = 0; k < w.str.length; k++) wordWidth += charWidth(w.startIdx + k, w.str[k]) + spacing;
    if (w.str.length > 0) wordWidth -= spacing;

    const hasContent = curChars.length > 0;
    const spaceIdx = w.startIdx - 1;
    const spaceWidth = hasContent ? charWidth(spaceIdx, ' ') + spacing : 0;
    const projected = curWidth + spaceWidth + wordWidth;

    if (hasContent && projected > maxWidth) {
      outLines.push(curChars);
      curChars = [];
      for (let k = 0; k < w.str.length; k++) curChars.push({ ch: w.str[k], idx: w.startIdx + k });
      curWidth = wordWidth;
    } else {
      if (hasContent) {
        curChars.push({ ch: ' ', idx: spaceIdx });
        curWidth += spaceWidth;
      }
      for (let k = 0; k < w.str.length; k++) curChars.push({ ch: w.str[k], idx: w.startIdx + k });
      curWidth += wordWidth;
    }
  });
  outLines.push(curChars);
  return outLines;
}

function wrapTextIndexed(ctx, str, maxWidth, spacing, fontSize) {
  const lines = [];
  let paraStart = 0;
  for (let i = 0; i <= str.length; i++) {
    if (i === str.length || str[i] === '\n') {
      const paraStr = str.slice(paraStart, i);
      lines.push(...wrapParagraph(ctx, paraStr, paraStart, maxWidth, spacing, fontSize));
      paraStart = i + 1;
    }
  }
  return lines;
}

// ---- 라인 내 글자 위치 계산 (정렬 + justify 처리) ----
function computeLinePositions(ctx, chars, alignment, boxLeft, boxRight, spacing, isLastLine, fontSize) {
  const contentWidth = boxRight - boxLeft;
  const widths = chars.map(c => {
    ctx.font = buildCharFont(c.idx, fontSize);
    return ctx.measureText(c.ch).width;
  });
  const lineWidth = widths.reduce((s, w, i) => s + w + (i < widths.length - 1 ? spacing : 0), 0);

  if (alignment === 'justify' && !isLastLine) {
    const wordGroups = [];
    let curIdxs = [];
    chars.forEach((c, i) => {
      if (c.ch === ' ') { wordGroups.push(curIdxs); curIdxs = []; }
      else curIdxs.push(i);
    });
    wordGroups.push(curIdxs);

    if (wordGroups.length > 1) {
      const wordWidths = wordGroups.map(g => g.reduce((s, i, gi) => s + widths[i] + (gi < g.length - 1 ? spacing : 0), 0));
      const totalWordsWidth = wordWidths.reduce((a, b) => a + b, 0);
      const gapWidth = (contentWidth - totalWordsWidth) / (wordGroups.length - 1);
      const positions = [];
      let x = boxLeft;
      wordGroups.forEach((g, gi) => {
        g.forEach((charI, k) => {
          positions.push({ idx: chars[charI].idx, ch: chars[charI].ch, x, width: widths[charI] });
          x += widths[charI] + (k < g.length - 1 ? spacing : 0);
        });
        if (gi < wordGroups.length - 1) x += gapWidth;
      });
      return { positions, lineWidth: contentWidth };
    }
  }

  let startX;
  if (alignment === 'left' || alignment === 'justify') startX = boxLeft;
  else if (alignment === 'right') startX = boxRight - lineWidth;
  else startX = boxLeft + (contentWidth - lineWidth) / 2;

  const positions = [];
  let x = startX;
  chars.forEach((c, i) => {
    positions.push({ idx: c.idx, ch: c.ch, x, width: widths[i] });
    x += widths[i] + (i < chars.length - 1 ? spacing : 0);
  });

  return { positions, lineWidth };
}

function drawHighlightsForLine(ctx, positions, y, lineHeight, fontSize) {
  let i = 0;
  while (i < positions.length) {
    const color = formats[positions[i].idx] ? formats[positions[i].idx].highlightColor : null;
    if (!color) { i++; continue; }
    let j = i;
    while (j < positions.length && formats[positions[j].idx] && formats[positions[j].idx].highlightColor === color) j++;
    const runStartX = positions[i].x;
    const last = positions[j - 1];
    const runEndX = last.x + last.width;
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.55;
    const padY = fontSize * 0.12;
    ctx.fillRect(runStartX - 3, y - lineHeight / 2 + padY, (runEndX - runStartX) + 6, lineHeight - padY * 2);
    ctx.globalAlpha = 1;
    i = j;
  }
}

function drawUnderlinesForLine(ctx, positions, y, fontSize, color) {
  let i = 0;
  while (i < positions.length) {
    const on = formats[positions[i].idx] && formats[positions[i].idx].underline;
    if (!on) { i++; continue; }
    let j = i;
    while (j < positions.length && formats[positions[j].idx] && formats[positions[j].idx].underline) j++;
    const runStartX = positions[i].x;
    const last = positions[j - 1];
    const runEndX = last.x + last.width;
    const lineY = y + fontSize * 0.36;
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1, fontSize * 0.05);
    ctx.beginPath();
    ctx.moveTo(runStartX, lineY);
    ctx.lineTo(runEndX, lineY);
    ctx.stroke();
    i = j;
  }
}

function draw() {
  renderEditorPreview();
  const W = canvas.width, H = canvas.height;
  const bg = bgColorEl.value;
  const color = textColorEl.value;
  const fontSize = parseInt(fontSizeEl.value, 10);
  const spacing = parseFloat(letterSpacingEl.value);
  const lineHeightPct = parseInt(lineHeightEl.value, 10);
  const sourceFontSize = parseInt(sourceFontSizeEl.value, 10);
  const marginY = parseInt(marginYEl.value, 10);
  const marginX = parseInt(marginXEl.value, 10);
  const alignment = alignEl.value;

  fontSizeVal.textContent = fontSize;
  letterSpacingVal.textContent = spacing.toFixed(1);
  lineHeightVal.textContent = lineHeightPct;
  sourceFontSizeVal.textContent = sourceFontSize;
  marginYVal.textContent = marginY;
  marginXVal.textContent = marginX;

  const boxLeft = marginX;
  const boxRight = W - marginX;
  const contentWidth = boxRight - boxLeft;

  const rawLines = wrapTextIndexed(ctx, text, contentWidth, spacing, fontSize);
  const lineHeight = fontSize * (lineHeightPct / 100);

  const SOURCE_BOTTOM_OFFSET = 40; // 위·아래 여백 슬라이더와 무관하게 고정
  const bottomReserve = SOURCE_BOTTOM_OFFSET + sourceFontSize * 1.4;
  const availableHeight = Math.max(lineHeight, H - marginY - bottomReserve);
  const linesPerPage = Math.max(1, Math.floor(availableHeight / lineHeight));
  const totalPages = Math.max(1, Math.ceil(rawLines.length / linesPerPage));

  if (currentPage > totalPages - 1) currentPage = totalPages - 1;
  if (currentPage < 0) currentPage = 0;

  pageIndicator.textContent = `${currentPage + 1} / ${totalPages}`;
  prevBtn.disabled = currentPage === 0;
  nextBtn.disabled = currentPage >= totalPages - 1;

  const pageLines = rawLines.slice(currentPage * linesPerPage, (currentPage + 1) * linesPerPage);
  const isLastPage = currentPage === totalPages - 1;

  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const startY = marginY + lineHeight / 2;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';

  const lineLayouts = pageLines.map((chars, i) => {
    const globalLineIndex = currentPage * linesPerPage + i;
    const isLastLineOfQuote = globalLineIndex === rawLines.length - 1;
    return computeLinePositions(ctx, chars, alignment, boxLeft, boxRight, spacing, isLastLineOfQuote, fontSize);
  });

  lineLayouts.forEach((layout, i) => {
    const y = startY + i * lineHeight;
    drawHighlightsForLine(ctx, layout.positions, y, lineHeight, fontSize);
  });

  lineLayouts.forEach((layout, i) => {
    const y = startY + i * lineHeight;
    layout.positions.forEach(p => {
      ctx.font = buildCharFont(p.idx, fontSize);
      ctx.fillStyle = color;
      ctx.fillText(p.ch, p.x, y);
    });
  });

  lineLayouts.forEach((layout, i) => {
    const y = startY + i * lineHeight;
    drawUnderlinesForLine(ctx, layout.positions, y, fontSize, color);
  });

  if (isLastPage) {
    const def = FONT_DEFS[fontFamilyEl.value];
    ctx.font = `${def.weights.regular} ${sourceFontSize}px ${def.css}`;
    ctx.fillStyle = sourceColorEl.value;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(sourceEl.value, boxRight, H - SOURCE_BOTTOM_OFFSET);
  }
}

[bgColorEl, textColorEl, fontSizeEl, fontFamilyEl, weightEl, alignEl, letterSpacingEl, lineHeightEl, marginYEl, marginXEl]
  .forEach(node => {
    node.addEventListener('input', () => { currentPage = 0; draw(); });
    node.addEventListener('change', () => { currentPage = 0; draw(); });
  });

[sourceEl, sourceFontSizeEl, sourceColorEl].forEach(node => {
  node.addEventListener('input', draw);
  node.addEventListener('change', draw);
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = `quote-page${currentPage + 1}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
});

async function loadFontsAndDraw() {
  try {
    await Promise.all([
      document.fonts.load("100 16px 'Pretendard Variable'"),
      document.fonts.load("400 16px 'Pretendard Variable'"),
      document.fonts.load("700 16px 'Pretendard Variable'"),
      document.fonts.load("300 16px 'KoPubWorld Batang'"),
      document.fonts.load("400 16px 'KoPubWorld Batang'"),
      document.fonts.load("700 16px 'KoPubWorld Batang'"),
    ]);
  } catch (e) {
    console.warn('font load issue', e);
  }
  draw();
}
loadFontsAndDraw();
</script>
