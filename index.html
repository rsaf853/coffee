<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>r♡sie/editor</title>
<!-- Pretendard & Noto Serif KR 폰트 불러오기 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@300;400;500;700&family=Hahmlet:wght@300;400;500;700&family=Noto+Serif+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Pretendard Variable', -apple-system, sans-serif;
    background: #efefef;
    color: #111;
  }

  ::placeholder {
    color: #aaa;
    opacity: 1; 
  }
  
  #titleInput::placeholder {
    color: #d0d0d0;
  }

  main {
    display: flex;
    flex-direction: column;
    max-width: 1400px;
    margin: 0 auto;
    height: 100vh;
  }

  /* 모바일 환경 캔버스 확대 적용 */
  @media (max-width: 899px) {
    #previewCol {
      flex: 1.5;
      min-height: 55vh;
    }
    #panelCol {
      flex: 1;
    }
  }

  #previewCol {
    order: 0;
    background: #efefef;
    display: flex;
    flex-direction: column;
    flex: 1; 
    position: relative;
    overflow: hidden;
  }

  #scrollArea {
    flex: 1;
    overflow: auto;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px 10px 70px;
  }

  canvas {
    display: block;
    background: #fff;
    border: 1px solid #e0e0e0;
    width: 460px;
    max-width: 95vw;
    height: auto;
    transition: width 0.05s ease-out;
    cursor: grab;
  }
  canvas:active {
    cursor: grabbing;
  }

  .bottom-bar {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(4px);
    padding: 6px 14px;
    border: 1px solid #eaeaea; 
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); 
    flex-wrap: nowrap;
    justify-content: center;
    white-space: nowrap;
  }

  .bottom-bar .divider {
    width: 1px;
    height: 14px;
    background: #e2e2e2;
  }

  #pageNav {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #555;
  }

  #pageNav button {
    border: 1px solid #e0e0e0;
    background: #fff;
    color: #333;
    padding: 4px 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    border-radius: 4px;
    transition: background 0.2s;
  }
  #pageNav button:hover:not(:disabled) { background: #f5f5f5; }
  #pageNav button:disabled { opacity: 0.35; cursor: default; }

  #zoomControl {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: #777;
    user-select: none;
  }
  #zoomControl input[type="range"] {
    width: 70px;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: #eaeaea;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  #zoomControl input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #aaa;
    cursor: pointer;
    transition: background 0.2s;
  }

  #resizer { display: none; }

  #panelCol { 
    order: 2; 
    padding: 12px 14px; 
    background: #fff; 
    border-top: 1px solid #eee;
    overflow-y: auto;
  }

  .panel { width: 100%; max-width: 460px; margin: 0 auto; display: flex; flex-direction: column;}

  @media (min-width: 900px) {
    main { flex-direction: row; align-items: stretch; }
    
    #resizer {
      order: 1;
      display: block;
      width: 8px;
      background: #e0e0e0;
      cursor: col-resize;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    #resizer:hover, #resizer.resizing { background: #bbb; }

    #panelCol {
      order: 2;
      width: 440px;
      min-width: 300px;
      max-width: 800px;
      flex: none;
      height: 100vh;
      border-left: none;
      border-top: none;
      padding: 16px 16px; 
    }
    .panel { max-width: none; }
  }

  details.panel-section {
    padding-bottom: 12px;
    margin-bottom: 12px;
    border-bottom: 1px solid #e2e2e2;
  }
  details.panel-section summary {
    font-size: 14px;
    font-weight: 700;
    color: #111;
    margin: 0;
    cursor: pointer;
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
  }
  details.panel-section summary::-webkit-details-marker { display: none; }
  details.panel-section summary::after {
    content: '';
    display: block;
    width: 6px; height: 6px;
    border-right: 1.5px solid #bbb;
    border-bottom: 1.5px solid #bbb;
    transform: rotate(45deg);
    transition: transform 0.2s ease, margin 0.2s ease;
    margin-right: 4px; margin-bottom: 2px;
  }
  details.panel-section[open] summary::after { transform: rotate(-135deg); margin-bottom: -4px; }

  .details-content { padding: 10px 0 0 0; }

  .field { margin-bottom: 10px; }
  .field:last-child { margin-bottom: 0; }
  
  .field label {
    display: block;
    margin-bottom: 4px;
    font-size: 12px;
    color: #777;
  }

  .field input[type=text],
  .field input[type=number],
  .field select {
    width: 100%;
    padding: 8px 10px; 
    border: 1px solid #ddd;
    background: #fff;
    color: #111;
    font-size: 13px;
    font-family: inherit;
    border-radius: 4px;
  }

  .field select {
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, #999 50%), linear-gradient(135deg, #999 50%, transparent 50%);
    background-position: calc(100% - 16px) center, calc(100% - 11px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    cursor: pointer;
  }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .row2:last-child { margin-bottom: 0; }

  .row-template-save {
    display: grid;
    grid-template-columns: 1fr 88px;
    gap: 8px;
    align-items: center;
  }

  input[type="color"]:not(.inline-picker) {
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    width: 100%;
    height: 34px; 
    border: 1px solid #ddd;
    padding: 0;
    background: none;
    cursor: pointer;
    border-radius: 4px;
    overflow: hidden;
  }
  input[type="color"]:not(.inline-picker)::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"]:not(.inline-picker)::-webkit-color-swatch { border: none; }
  input[type="color"]:not(.inline-picker)::-moz-color-swatch { border: none; }

  .field input[type=range] { width: 100%; accent-color: #111; margin-top: 4px; }
  .hint { font-size: 11px; color: #888; margin: -4px 0 6px; line-height: 1.3; }

  .swatches { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .swatch {
    width: 26px; height: 26px; border: 1px solid #ccc;
    cursor: pointer; border-radius: 4px; padding: 0;
  }

  .editor-toolbar {
    display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 0;
    background: #fcfcfc; padding: 6px; border: 1px solid #ddd;
    border-bottom: none; border-radius: 4px 4px 0 0;
    align-items: center;
  }

  .tbtn {
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    padding: 0 8px; height: 28px; border: 1px solid #ccc; background: #fff;
    color: #333; font-size: 12px; cursor: pointer; font-family: inherit;
    border-radius: 4px; transition: 0.2s; box-sizing: border-box; white-space: nowrap;
  }
  .tbtn:hover { background: #f2f2f2; }
  .tbtn.danger { color: #d44; border-color: #f0caca; }
  .tbtn.danger:hover { background: #fdf2f2; }

  .color-picker-wrap {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 0 7px 0 9px;
  }

  .inline-picker {
    appearance: none;
    -webkit-appearance: none;
    border: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    padding: 0;
    cursor: pointer;
    background: none;
  }
  .inline-picker::-webkit-color-swatch-wrapper { padding: 0; }
  .inline-picker::-webkit-color-swatch { border: none; border-radius: 50%; }
  .inline-picker::-moz-color-swatch { border: none; border-radius: 50%; }

  #editor {
    width: 100%; 
    min-height: 140px; 
    height: 140px; 
    padding: 10px 12px; 
    border: 1px solid #ddd; 
    border-radius: 0 0 4px 4px;
    background: #fff; 
    color: #111; 
    font-size: 12px; 
    font-family: inherit;
    line-height: 1.5; 
    outline: none; 
    overflow-y: auto;
    white-space: pre-wrap; 
    word-break: break-word;
    resize: vertical; /* 세로 방향으로만 드래그하여 크기 조절 가능 */
    margin-top: 0;
  }
  #editor:empty::before {
    content: attr(data-placeholder); color: #aaa; pointer-events: none; display: block;
  }
  #editor:focus { border-color: #999; }

  .action-btns { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .btn-primary, .btn-secondary {
    width: 100%; padding: 10px; border-radius: 4px; font-size: 13px;
    font-weight: 600; cursor: pointer; font-family: inherit; transition: 0.2s;
  }
  .btn-primary { border: 1px solid #111; background: #111; color: #fff; }
  .btn-primary:hover { background: #333; }
  .btn-secondary { border: 1px solid #ccc; background: #fff; color: #111; }
  .btn-secondary:hover { background: #f4f4f4; border-color: #111; }

  .footer-credit { margin-top: 16px; text-align: right; font-size: 12px; color: #aaa; font-weight: 300; padding-bottom: 20px;}
</style>
</head>
<body>

<div style="position:absolute; width:0; height:0; overflow:hidden; visibility:hidden;">
  <span style="font-family:'Noto Serif KR'">.</span>
  <span style="font-family:'Gothic A1'">.</span>
  <span style="font-family:'Hahmlet'">.</span>
</div>

<main>
  <div id="previewCol">
    <div id="scrollArea">
      <canvas id="canvas"></canvas>
    </div>
    
    <div class="bottom-bar">
      <div id="pageNav">
        <button id="prevBtn">&larr; 이전</button>
        <span id="pageIndicator">1 / 1</span>
        <button id="nextBtn">다음 &rarr;</button>
      </div>
      <div class="divider"></div>
      <div id="zoomControl">
        <span style="display:flex; align-items:center; gap:4px;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg> 
          배율
        </span>
        <input type="range" id="canvasZoom" min="40" max="160" step="5" value="120">
        <span id="canvasZoomVal" style="width:36px; text-align:right;">120%</span>
      </div>
    </div>
  </div>

  <div id="resizer"></div>

  <div id="panelCol">
    <div class="panel">

      <!-- 1. 배경 -->
      <details class="panel-section">
        <summary class="section-title">배경</summary>
        <div class="details-content">
          <div class="row2">
            <div class="field">
              <label>가로 폭 (px)</label>
              <input type="number" id="canvasWidth" value="800">
            </div>
            <div class="field">
              <label>높이 설정</label>
              <select id="heightMode">
                <option value="4:5">비율 (4:5)</option>
                <option value="3:4">비율 (3:4)</option>
                <option value="1:1">비율 (1:1)</option>
                <option value="auto">내용에 맞게 자동 (1장)</option>
                <option value="custom">세로 높이 직접 입력</option>
              </select>
            </div>
          </div>
          
          <div class="field" id="customHeightWrap" style="display: none;">
            <label>세로 높이 (px)</label>
            <input type="number" id="canvasHeight" value="1000">
          </div>

          <div class="row2">
            <div class="field">
              <label>위·아래 여백 (<span id="marginYVal">70</span>px)</label>
              <input type="range" id="marginY" min="0" max="200" step="5" value="70">
            </div>
            <div class="field">
              <label>양쪽 여백 (<span id="marginXVal">70</span>px)</label>
              <input type="range" id="marginX" min="0" max="200" step="5" value="70">
            </div>
          </div>
          <div class="field">
            <label>배경 단색 색상</label>
            <input type="color" id="bgColor" value="#ffffff">
          </div>
          
          <div class="field" style="margin-top: 12px; border-top: 1px dashed #ddd; padding-top: 12px;">
            <label>배경 이미지 첨부</label>
            <input type="file" id="bgImageInput" accept="image/*" style="font-size: 12px; margin-bottom: 8px;">
            <button type="button" class="tbtn" id="removeBgImageBtn" style="width: 100%;">이미지 제거</button>
          </div>
          <div class="row2">
            <div class="field">
              <label>투명도 (<span id="bgOpacityVal">100</span>%)</label>
              <input type="range" id="bgOpacity" min="0" max="100" value="100">
            </div>
            <div class="field">
              <label>어둡기 (<span id="bgDarknessVal">0</span>%)</label>
              <input type="range" id="bgDarkness" min="0" max="100" value="0">
            </div>
          </div>
          <div class="field">
            <label>이미지 확대 (<span id="bgScaleVal">100</span>%)</label>
            <input type="range" id="bgScale" min="10" max="300" value="100">
          </div>
          <div class="hint">💡 이미지를 등록한 후, 캔버스 위에서 마우스(또는 터치)로 드래그하면 위치를 조절할 수 있습니다.</div>
        </div>
      </details>
      
      <!-- 2. 제목 -->
      <details class="panel-section">
        <summary class="section-title">제목</summary>
        <div class="details-content">
          <div class="field">
            <label>제목 내용 (첫 페이지 상단 노출)</label>
            <input type="text" id="titleInput" placeholder="제목을 입력하세요">
          </div>
          <div class="row2">
            <div class="field">
              <label>글자 크기 (<span id="titleFontSizeVal">24</span>px)</label>
              <input type="range" id="titleFontSize" min="10" max="60" value="24">
            </div>
            <div class="field">
              <label>글자색</label>
              <input type="color" id="titleColor" value="#000000">
            </div>
          </div>
          <div class="row2">
            <div class="field">
              <label>정렬</label>
              <select id="titleAlign">
                <option value="left" selected>왼쪽</option>
                <option value="center">가운데</option>
                <option value="right">오른쪽</option>
              </select>
            </div>
            <div class="field">
              <label>굵기</label>
              <select id="titleWeight">
                <option value="thin">Thin</option>
                <option value="regular">Regular</option>
                <option value="medium">Medium</option>
                <option value="bold" selected>Bold</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label>본문과의 간격 (<span id="titleSpacingVal">20</span>px)</label>
            <input type="range" id="titleSpacing" min="0" max="200" step="5" value="20">
          </div>
        </div>
      </details>

      <!-- 3. 서식 -->
      <details class="panel-section">
        <summary class="section-title">서식</summary>
        <div class="details-content">
          <div class="field">
            <label>기본 폰트</label>
            <select id="fontFamily">
              <option value="pretendard" selected>Pretendard Variable (기본)</option>
              <option value="noto">Noto Serif KR (명조체)</option>
              <option value="gothic">Gothic A1 (고딕)</option>
              <option value="hahmlet">함렛 (Hahmlet)</option>
            </select>
          </div>
          
          <div class="row2">
            <div class="field">
              <label>줄바꿈 기준</label>
              <select id="lineBreakMode">
                <option value="word" selected>단어 단위 (기본)</option>
                <option value="char">글자 단위</option>
              </select>
            </div>
            <div class="field">
              <label>정렬</label>
              <select id="align">
                <option value="left" selected>왼쪽</option>
                <option value="center">가운데</option>
                <option value="right">오른쪽</option>
                <option value="justify">양쪽 정렬</option>
              </select>
            </div>
          </div>
          
          <div class="row2">
            <div class="field">
              <label>굵기</label>
              <select id="weight">
                <option value="thin">Thin</option>
                <option value="regular" selected>Regular</option>
                <option value="medium">Medium</option>
                <option value="bold">Bold</option>
              </select>
            </div>
            <div class="field">
              <label>기본 글자색</label>
              <input type="color" id="textColor" value="#000000">
            </div>
          </div>
          
          <div class="field">
            <label>글자 크기 (<span id="fontSizeVal">20</span>px)</label>
            <input type="range" id="fontSize" min="10" max="90" value="20">
          </div>
          
          <div class="row2">
            <div class="field">
              <label>줄간격 (<span id="lineHeightVal">150</span>%)</label>
              <input type="range" id="lineHeight" min="100" max="250" step="5" value="150">
            </div>
            <div class="field">
              <label>문단 간격 (<span id="paraSpacingVal">0</span>px)</label>
              <input type="range" id="paraSpacing" min="-10" max="10" step="1" value="0">
            </div>
          </div>

          <div class="row2">
            <div class="field">
              <label>글자 간격 (<span id="letterSpacingVal">-0.5</span>px)</label>
              <input type="range" id="letterSpacing" min="-2" max="2" step="0.1" value="-0.5">
            </div>
            <div class="field">
              <label>장평 (<span id="scaleXVal">97</span>%)</label>
              <input type="range" id="scaleX" min="80" max="120" step="1" value="97">
            </div>
          </div>
        </div>
      </details>

      <!-- 4. 본문 -->
      <details class="panel-section" open>
        <summary class="section-title">본문</summary>
        <div class="details-content">
          <div class="hint">텍스트를 드래그한 뒤 툴바를 누르면 적용됩니다.</div>
          
          <div class="editor-toolbar">
            <button type="button" class="tbtn" id="tbBold"><b>B</b></button>
            <button type="button" class="tbtn" id="tbItalic"><i>I</i></button>
            <button type="button" class="tbtn" id="tbUnderline"><u>U</u></button>
            <button type="button" class="tbtn" id="tbStrike"><s>S</s></button>
            
            <button type="button" class="tbtn color-picker-wrap" id="tbApplyColor">
              글자색 <input type="color" id="inlineColorPicker" class="inline-picker" value="#358AE8" title="글자색 선택">
            </button>

            <button type="button" class="tbtn" id="tbHiOn">형광펜 적용</button>
            <button type="button" class="tbtn danger" id="tbClear">서식 지우기</button>
          </div>

          <div id="editor" contenteditable="true" data-placeholder="당신은 내 거야. 나의 남편, 나의 포로, 나의 유일한 구원. 이 날, 나는 기꺼이 너의 제물이 되었다. 내 생애 가장 완벽한 순간."></div>
          
          <div class="row2" style="margin-top: 10px;">
            <button type="button" class="tbtn" id="tbRemoveAst" style="width: 100%;">* * (별표) 지우기</button>
            <button type="button" class="tbtn" id="tbRemoveQuote" style="width: 100%;">따옴표( “ ” " ) 지우기</button>
          </div>
          
          <div class="field" style="margin-top: 12px;">
            <label>형광펜 색상</label>
            <input type="color" id="highlightColor" value="#FFE0F9">
            <div class="swatches">
              <button type="button" class="swatch" data-color="#FFE0F9" style="background:#FFE0F9"></button>
              <button type="button" class="swatch" data-color="#DBF7FF" style="background:#DBF7FF"></button>
              <button type="button" class="swatch" data-color="#DBFFDF" style="background:#DBFFDF"></button>
              <button type="button" class="swatch" data-color="#FCFFBF" style="background:#FCFFBF"></button>
              <button type="button" class="swatch" data-color="#EDEDED" style="background:#EDEDED"></button>
            </div>
          </div>

          <div class="row2" style="margin-top: 10px;">
            <div class="field" style="margin-bottom: 0;">
              <label>* * (별표) 안 색상</label>
              <input type="color" id="asteriskColor" value="#777777">
            </div>
            <div class="field" style="margin-bottom: 0;">

</main>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const el = id => document.getElementById(id);

const editorEl = el('editor');
const sourceEl = el('source');
const bgColorEl = el('bgColor');
const textColorEl = el('textColor');
const fontSizeEl = el('fontSize');
const fontFamilyEl = el('fontFamily');
const lineBreakModeEl = el('lineBreakMode');
const weightEl = el('weight');
const alignEl = el('align');
const inlineColorPickerEl = el('inlineColorPicker');
const highlightColorEl = el('highlightColor');
const asteriskColorEl = el('asteriskColor');
const quoteColorEl = el('quoteColor');
const letterSpacingEl = el('letterSpacing');
const paraSpacingEl = el('paraSpacing'); 
const paraSpacingValEl = el('paraSpacingVal');
const lineHeightEl = el('lineHeight');
const scaleXEl = el('scaleX');
const sourceFontSizeEl = el('sourceFontSize');
const sourceColorEl = el('sourceColor');
const marginYEl = el('marginY');
const marginXEl = el('marginX');
const zoomEl = el('canvasZoom');

const canvasWidthEl = el('canvasWidth');
const heightModeEl = el('heightMode');
const canvasHeightEl = el('canvasHeight');
const customHeightWrap = el('customHeightWrap');

const prevBtn = el('prevBtn');
const nextBtn = el('nextBtn');
const pageIndicator = el('pageIndicator');

let bgImageObj = null;
let bgOffsetX = 0;
let bgOffsetY = 0;
let isDraggingBg = false;
let dragStartX = 0;
let dragStartY = 0;

const bgImageInput = el('bgImageInput');
const removeBgImageBtn = el('removeBgImageBtn');
const bgOpacityEl = el('bgOpacity');
const bgDarknessEl = el('bgDarkness');
const bgScaleEl = el('bgScale');

const FONT_DEFS = {
  pretendard: { name: 'Pretendard Variable', css: "'Pretendard Variable', sans-serif", weights: { thin: 100, regular: 400, medium: 500, bold: 700 } },
  noto:       { name: 'Noto Serif KR', css: "'Noto Serif KR', serif",           weights: { thin: 300, regular: 400, medium: 500, bold: 700 } },
  gothic:     { name: 'Gothic A1', css: "'Gothic A1', sans-serif",          weights: { thin: 300, regular: 400, medium: 500, bold: 700 } },
  hahmlet:    { name: 'Hahmlet', css: "'Hahmlet', serif",                 weights: { thin: 300, regular: 400, medium: 500, bold: 700 } }
};

let currentPage = 0;
const DPR = 3; 
const BASE_PREVIEW_WIDTH = 460; 
const WORD_SPACING_OFFSET = -2;

function makeDefaultFormat() { 
  return { bold: false, italic: false, underline: false, strike: false, highlightColor: null, inlineColor: null, font: null, isAsterisk: false, isQuote: false }; 
}

heightModeEl.addEventListener('change', (e) => {
  customHeightWrap.style.display = (e.target.value === 'custom') ? 'block' : 'none';
  currentPage = 0; 
  draw();
});
[canvasWidthEl, canvasHeightEl].forEach(item => item.addEventListener('input', draw));

function updateZoom() {
  const zoomPct = parseInt(zoomEl.value, 10);
  el('canvasZoomVal').textContent = zoomPct + '%';
  canvas.style.width = Math.round(BASE_PREVIEW_WIDTH * (zoomPct / 100)) + 'px';
}
zoomEl.addEventListener('input', updateZoom);

bgImageInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    const img = new Image();
    img.onload = () => {
      bgImageObj = img;
      bgOffsetX = 0; 
      bgOffsetY = 0; 
      
      // 이미지가 로드될 때 캔버스 가로폭에 딱 맞도록(100%) 스케일 자동 계산
      const currentCanvasWidth = parseInt(canvasWidthEl.value, 10) || 800;
      const initialScale = (currentCanvasWidth / img.width) * 100;
      bgScaleEl.value = Math.max(10, Math.min(300, Math.round(initialScale)));
      el('bgScaleVal').textContent = bgScaleEl.value;

      draw();
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
});

removeBgImageBtn.addEventListener('click', () => {
  bgImageObj = null;
  bgImageInput.value = '';
  draw();
});

[bgOpacityEl, bgDarknessEl, bgScaleEl].forEach(input => {
  input.addEventListener('input', (e) => {
    el(e.target.id + 'Val').textContent = e.target.value;
    draw();
  });
});

function getPointerPos(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  
  const scaleX = (canvas.width / DPR) / rect.width;
  const scaleY = (canvas.height / DPR) / rect.height;
  
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

function startDrag(e) {
  if (!bgImageObj) return;
  isDraggingBg = true;
  const pos = getPointerPos(e);
  dragStartX = pos.x - bgOffsetX;
  dragStartY = pos.y - bgOffsetY;
}

function doDrag(e) {
  if (!isDraggingBg || !bgImageObj) return;
  e.preventDefault(); 
  const pos = getPointerPos(e);
  bgOffsetX = pos.x - dragStartX;
  bgOffsetY = pos.y - dragStartY;
  draw();
}

function endDrag() {
  isDraggingBg = false;
}

canvas.addEventListener('mousedown', startDrag);
canvas.addEventListener('mousemove', doDrag);
window.addEventListener('mouseup', endDrag);

canvas.addEventListener('touchstart', startDrag, {passive: false});
canvas.addEventListener('touchmove', doDrag, {passive: false});
window.addEventListener('touchend', endDrag);

el('tbBold').addEventListener('mousedown', e => { e.preventDefault(); document.execCommand('bold'); applyAutoFormat(); draw(); });
el('tbItalic').addEventListener('mousedown', e => { e.preventDefault(); document.execCommand('italic'); applyAutoFormat(); draw(); });
el('tbUnderline').addEventListener('mousedown', e => { e.preventDefault(); document.execCommand('underline'); applyAutoFormat(); draw(); });
el('tbStrike').addEventListener('mousedown', e => { e.preventDefault(); document.execCommand('strikeThrough'); applyAutoFormat(); draw(); });
el('tbClear').addEventListener('mousedown', e => { e.preventDefault(); document.execCommand('removeFormat'); applyAutoFormat(); draw(); });

el('tbApplyColor').addEventListener('mousedown', e => { 
  e.preventDefault(); 
  document.execCommand('foreColor', false, inlineColorPickerEl.value); 
  applyAutoFormat();
  draw(); 
});

el('tbHiOn').addEventListener('mousedown', e => {
  e.preventDefault();
  const c = highlightColorEl.value;
  document.execCommand('hiliteColor', false, c) || document.execCommand('backColor', false, c);
  applyAutoFormat();
  draw();
});

document.querySelectorAll('.swatch').forEach(btn => {
  btn.addEventListener('click', () => { highlightColorEl.value = btn.dataset.color; });
});

function extractDataFromEditor() {
  const tokens = [];
  const isEmpty = editorEl.textContent.trim() === '';
  const rootFormat = makeDefaultFormat();
  
  if (isEmpty) {
    const phText = editorEl.getAttribute('data-placeholder') || '';
    tokens.push({ text: phText, format: rootFormat, isPlaceholder: true });
    return tokens;
  }

  let state = { inAst: false, inQuote: false };

  function traverse(node, currentFmt) {
    if (node.nodeType === 3) {
      let text = node.nodeValue;
      if (!text) return;

      let curBuf = "";
      let curFmtState = { inAst: state.inAst, inQuote: state.inQuote };

      function flush() {
        if (curBuf.length > 0) {
          tokens.push({
            text: curBuf,
            format: { ...currentFmt, isAsterisk: curFmtState.inAst, isQuote: curFmtState.inQuote },
            isPlaceholder: false
          });
          curBuf = "";
        }
      }

      for (let i = 0; i < text.length; i++) {
        let ch = text[i];
        if (ch === '\n') {
          flush();
          tokens.push({ text: '\n', format: { ...currentFmt }, isPlaceholder: false });
          curFmtState = { inAst: state.inAst, inQuote: state.inQuote };
          continue;
        }

        let isAst = (ch === '*');
        let isQ = (ch === '"' || ch === '“' || ch === '”');

        if (isAst) {
          if (!state.inAst) { flush(); state.inAst = true; curFmtState = { inAst: state.inAst, inQuote: state.inQuote }; curBuf += ch; }
          else { curBuf += ch; flush(); state.inAst = false; curFmtState = { inAst: state.inAst, inQuote: state.inQuote }; }
        } else if (isQ) {
          if (!state.inQuote) { flush(); state.inQuote = true; curFmtState = { inAst: state.inAst, inQuote: state.inQuote }; curBuf += ch; }
          else { curBuf += ch; flush(); state.inQuote = false; curFmtState = { inAst: state.inAst, inQuote: state.inQuote }; }
        } else {
          if (curFmtState.inAst !== state.inAst || curFmtState.inQuote !== state.inQuote) {
            flush();
            curFmtState = { inAst: state.inAst, inQuote: state.inQuote };
          }
          curBuf += ch;
        }
      }
      flush();
      return;
    }

    if (node.nodeType === 1) {
      if (node.id === 'start-marker') { tokens.push({ isStartMarker: true }); return; }
      if (node.id === 'end-marker') { tokens.push({ isEndMarker: true }); return; }
      if (node.tagName === 'BR') { tokens.push({ text: '\n', format: { ...currentFmt }, isPlaceholder: false }); return; }

      const newFmt = { ...currentFmt };
      if (['B', 'STRONG'].includes(node.tagName) || node.style.fontWeight === 'bold' || parseInt(node.style.fontWeight) >= 700) newFmt.bold = true;
      if (['I', 'EM'].includes(node.tagName) || node.style.fontStyle === 'italic') newFmt.italic = true;
      if (['U'].includes(node.tagName) || node.style.textDecoration.includes('underline')) newFmt.underline = true;
      if (['S', 'STRIKE', 'DEL'].includes(node.tagName) || node.style.textDecoration.includes('line-through')) newFmt.strike = true;
      
      let fg = node.style ? node.style.color : null;
      if (node.hasAttribute && (node.hasAttribute('data-auto-ast') || node.hasAttribute('data-auto-quote'))) fg = null; 
      if (!fg && node.tagName === 'FONT' && node.hasAttribute('color')) fg = node.getAttribute('color');
      if (fg && fg !== '' && fg !== 'inherit') newFmt.inlineColor = fg;
      
      let bg = node.style ? (node.style.backgroundColor || node.style.background) : null;
      if (bg) {
        let bgl = bg.toLowerCase();
        if (bgl.includes('rgba') && (bgl.includes(', 0)') || bgl.replace(/ /g,'').includes(',0)'))) bg = null;
        else if (bgl === 'transparent') bg = null;
      }
      if (bg) newFmt.highlightColor = bg;
      
      const isBlock = ['DIV', 'P', 'SECTION'].includes(node.tagName);
      if (isBlock && node !== editorEl && node !== editorEl.firstChild) {
        tokens.push({ text: '\n', format: { ...newFmt }, isPlaceholder: false });
      }
      if (isBlock && node.childNodes.length === 1 && node.firstChild.tagName === 'BR') {
        if (node === editorEl.firstChild) tokens.push({ text: '\n', format: { ...newFmt }, isPlaceholder: false });
        return;
      }

      Array.from(node.childNodes).forEach(child => traverse(child, newFmt));
    }
  }

  traverse(editorEl, rootFormat);
  return tokens;
}

function applyAutoFormat() {
    if (document.getElementById('start-marker')) return;

    const sel = window.getSelection();
    let hasSelection = false;
    if (sel.rangeCount > 0 && editorEl.contains(sel.anchorNode)) {
        hasSelection = true;
        const range = sel.getRangeAt(0);
        
        const startMarker = document.createElement('span');
        startMarker.id = 'start-marker';
        const endMarker = document.createElement('span');
        endMarker.id = 'end-marker';
        
        const rangeClone = range.cloneRange();
        rangeClone.collapse(false);
        rangeClone.insertNode(endMarker);
        range.insertNode(startMarker);
    }

    const tokens = extractDataFromEditor();
    
    let html = '';
    let currentBlock = '';
    
    tokens.forEach(tok => {
        if (tok.isStartMarker) { currentBlock += '<span id="start-marker"></span>'; return; }
        if (tok.isEndMarker) { currentBlock += '<span id="end-marker"></span>'; return; }
        if (tok.isPlaceholder) return;
        
        if (tok.text === '\n') {
            if (!currentBlock) currentBlock = '<br>';
            html += '<div>' + currentBlock + '</div>';
            currentBlock = '';
            return;
        }
        
        let spanHtml = tok.text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        
        let css = '';
        if (tok.format.bold) css += 'font-weight:bold;';
        if (tok.format.italic) css += 'font-style:italic;';
        if (tok.format.underline) css += 'text-decoration:underline;';
        if (tok.format.strike) css += 'text-decoration:line-through;';
        
        let dataAttrs = '';
        let color = '';
        if (tok.format.isQuote) { color = quoteColorEl.value; dataAttrs = 'data-auto-quote="true"'; } 
        else if (tok.format.isAsterisk) { color = asteriskColorEl.value; dataAttrs = 'data-auto-ast="true"'; } 
        else if (tok.format.inlineColor) { color = tok.format.inlineColor; }
        
        if (color) css += `color:${color};`;
        if (tok.format.highlightColor) css += `background-color:${tok.format.highlightColor};`;

        if (css || dataAttrs) currentBlock += `<span ${dataAttrs} style="${css}">${spanHtml}</span>`;
        else currentBlock += `<span>${spanHtml}</span>`;
    });
    
    if (currentBlock) html += '<div>' + currentBlock + '</div>';
    
    editorEl.innerHTML = html || '';
    
    if (hasSelection) {
        const sMarker = document.getElementById('start-marker');
        const eMarker = document.getElementById('end-marker');
        if (sMarker && eMarker) {
            const newRange = document.createRange();
            newRange.setStartAfter(sMarker);
            newRange.setEndBefore(eMarker);
            sel.removeAllRanges();
            sel.addRange(newRange);
            sMarker.remove();
            eMarker.remove();
        }
    }
}

el('tbRemoveAst').addEventListener('click', () => {
    editorEl.querySelectorAll('[data-auto-ast]').forEach(node => node.removeAttribute('data-auto-ast'));
    const walker = document.createTreeWalker(editorEl, NodeFilter.SHOW_TEXT, null, false);
    let node;
    while (node = walker.nextNode()) {
        if (node.nodeValue.includes('*')) node.nodeValue = node.nodeValue.replace(/\*/g, '');
    }
    applyAutoFormat();
    draw();
});

el('tbRemoveQuote').addEventListener('click', () => {
    editorEl.querySelectorAll('[data-auto-quote]').forEach(node => node.removeAttribute('data-auto-quote'));
    const walker = document.createTreeWalker(editorEl, NodeFilter.SHOW_TEXT, null, false);
    let node;
    while (node = walker.nextNode()) {
        if (/[“”"]/.test(node.nodeValue)) node.nodeValue = node.nodeValue.replace(/[“”"]/g, '');
    }
    applyAutoFormat();
    draw();
});

let isComposing = false;
editorEl.addEventListener('compositionstart', () => isComposing = true);
editorEl.addEventListener('compositionend', () => { isComposing = false; applyAutoFormat(); draw(); });
editorEl.addEventListener('input', () => { if (!isComposing) applyAutoFormat(); draw(); });

function getFontStr(fmt, size) {
  let fontId = fontFamilyEl.value;
  let def = FONT_DEFS[fontId] || FONT_DEFS['pretendard'];
  let wId = weightEl.value;
  if (fmt.bold) wId = 'bold';
  let wNum = def.weights[wId] || 400;
  let st = fmt.italic ? "italic " : "";
  return `${st}${wNum} ${size}px ${def.css}`;
}

function processTokens(tokens, size, ls) {
  let flat = [];
  tokens.forEach(tok => {
    if (tok.text === '\n') {
      flat.push(tok);
    } else {
      ctx.font = getFontStr(tok.format, size);
      
      if (lineBreakModeEl.value === 'char') {
        for(let i=0; i<tok.text.length; i++) {
          let char = tok.text[i];
          let w = ctx.measureText(char).width + ls;
          if (char === ' ') w += WORD_SPACING_OFFSET; 
          flat.push({ text: char, format: tok.format, w: w, isPlaceholder: tok.isPlaceholder });
        }
      } else {
        let words = tok.text.split(/(\s+)/);
        words.forEach(wrd => {
          if (!wrd) return;
          if (wrd.match(/^\s+$/)) {
            for(let i=0; i<wrd.length; i++) {
              let spaceW = ctx.measureText(wrd[i]).width + WORD_SPACING_OFFSET; 
              flat.push({ text: wrd[i], format: tok.format, w: spaceW, isPlaceholder: tok.isPlaceholder });
            }
          } else {
            let mw = ctx.measureText(wrd).width;
            mw += ls * (wrd.length - 1);
            flat.push({ text: wrd, format: tok.format, w: mw, isPlaceholder: tok.isPlaceholder, length: wrd.length });
          }
        });
      }
    }
  });
  return flat;
}

function computePages() {
  const w = parseInt(canvasWidthEl.value, 10) || 800;
  const hMode = heightModeEl.value;
  const my = parseInt(marginYEl.value, 10);
  const mx = parseInt(marginXEl.value, 10);
  
  const contentWidth = w - mx*2;
  const size = parseInt(fontSizeEl.value, 10);
  const lh = (parseInt(lineHeightEl.value, 10) / 100) * size;
  const ls = parseFloat(letterSpacingEl.value);
  
  const tokens = extractDataFromEditor();
  const els = processTokens(tokens, size, ls);
  
  const titleText = el('titleInput').value.trim();
  const titleSize = parseInt(el('titleFontSize').value, 10);
  const titleSpacing = parseInt(el('titleSpacing').value, 10);
  let titleHeightSpace = titleText ? (titleSize * 1.5 + titleSpacing) : 0;

  const pages = [];
  let currentLines = [];
  let currentLine = [];
  let currentX = 0;
  
  function breakLine() { currentLines.push(currentLine); currentLine = []; currentX = 0; }
  
  els.forEach(el => {
    if (el.text === '\n') { currentLine.push(el); breakLine(); return; }
    if (currentX + el.w > contentWidth && currentLine.length > 0) {
      if (lineBreakModeEl.value === 'word' && el.text !== ' ') { breakLine(); currentLine.push(el); currentX += el.w; }
      else { breakLine(); if (el.text !== ' ') { currentLine.push(el); currentX += el.w; } }
    } else {
      currentLine.push(el); currentX += el.w;
    }
  });
  
  if (currentLine.length > 0) currentLines.push(currentLine);
  if (currentLines.length === 0) currentLines.push([]);

  let presetHeight = 1000;
  if (hMode === 'custom') presetHeight = parseInt(canvasHeightEl.value, 10) || 1000;
  else if (hMode !== 'auto') { const parts = hMode.split(':').map(Number); presetHeight = Math.round(w * (parts[1] / parts[0])); }
  
  const contentHeightLimit = presetHeight - my*2 - 40; 

  let p = [];
  let pY = 0;
  let isFirstPage = true;
  const actualParaSpacing = parseInt(paraSpacingEl.value, 10);

  currentLines.forEach((ln, idx) => {
    let isNewPara = false;
    if (idx > 0) {
      const prevLine = currentLines[idx-1];
      if (prevLine.length > 0 && prevLine[prevLine.length-1].text === '\n') isNewPara = true;
      else if (prevLine.length === 0) isNewPara = true;
    }
    
    let pSpace = (isNewPara && idx > 0) ? actualParaSpacing : 0;
    let availableHeight = contentHeightLimit - (isFirstPage ? titleHeightSpace : 0);

    if (hMode !== 'auto' && pY + pSpace + lh > availableHeight && p.length > 0) {
      pages.push(p); p = []; pY = 0; pSpace = 0; isFirstPage = false;
    }
    
    pY += pSpace; ln.yOffset = pY; p.push(ln); pY += lh;
  });
  
  if (p.length > 0) pages.push(p);
  
  let finalCanvasHeight = presetHeight;
  if (hMode === 'auto') {
    const srcSize = parseInt(sourceFontSizeEl.value, 10);
    finalCanvasHeight = pY + (my * 2) + srcSize + 30 + titleHeightSpace; 
    if (finalCanvasHeight < w * 0.5) finalCanvasHeight = Math.round(w * 0.5);
  }
  
  return { pages, cWidth: w, cHeight: finalCanvasHeight, lh, size, my, mx, contentWidth, ls, titleHeightSpace };
}

function draw() {
  const { pages, cWidth, cHeight, lh, size, my, mx, contentWidth, ls, titleHeightSpace } = computePages();
  
  if (currentPage >= pages.length) currentPage = Math.max(0, pages.length - 1);
  if (currentPage < 0) currentPage = 0;
  
  prevBtn.disabled = (currentPage === 0);
  nextBtn.disabled = (currentPage >= pages.length - 1);
  pageIndicator.textContent = `${currentPage + 1} / ${pages.length}`;
  
  canvas.width = cWidth * DPR;
  canvas.height = cHeight * DPR;
  ctx.scale(DPR, DPR);
  
  ctx.fillStyle = bgColorEl.value;
  ctx.fillRect(0, 0, cWidth, cHeight);
  
  if (bgImageObj) {
    ctx.save();
    
    const opacity = parseInt(bgOpacityEl.value, 10) / 100;
    const darkness = parseInt(bgDarknessEl.value, 10) / 100;
    const brightness = 100 - (darkness * 100); 
    const scale = parseInt(bgScaleEl.value, 10) / 100;
    
    ctx.globalAlpha = opacity;
    ctx.filter = `brightness(${brightness}%)`;
    
    const drawW = bgImageObj.width * scale;
    const drawH = bgImageObj.height * scale;
    
    const centerX = (cWidth - drawW) / 2;
    const centerY = (cHeight - drawH) / 2;
    
    ctx.drawImage(bgImageObj, centerX + bgOffsetX, centerY + bgOffsetY, drawW, drawH);
    ctx.restore();
  }

  const align = alignEl.value;
  const baseColor = textColorEl.value;
  const astColor = asteriskColorEl.value;
  const quoteColor = quoteColorEl.value;
  const scaleX = parseInt(scaleXEl.value, 10) / 100;
  
  let startY = my + (lh - size)/2 + size; 

  const titleText = el('titleInput').value.trim();
  if (currentPage === 0 && titleText) {
     const tSize = parseInt(el('titleFontSize').value, 10);
     const tAlign = el('titleAlign').value;
     const tWeightId = el('titleWeight').value;
     
     ctx.save();
     let def = FONT_DEFS[fontFamilyEl.value] || FONT_DEFS['pretendard'];
     let tWNum = def.weights[tWeightId] || 700;
     ctx.font = `${tWNum} ${tSize}px ${def.css}`;
     ctx.fillStyle = el('titleColor').value;
     
     let tw = 0;
     for(let i=0; i<titleText.length; i++) tw += ctx.measureText(titleText[i]).width + ls;
     
     const totalScaledWidth = tw * scaleX; 
     let titleX = mx;
     if (tAlign === 'center') titleX = mx + (contentWidth - totalScaledWidth)/2;
     else if (tAlign === 'right') titleX = mx + contentWidth - totalScaledWidth;
     
     let cx = titleX;
     ctx.translate(0, my + tSize);
     ctx.scale(scaleX, 1);
     
     for(let i=0; i<titleText.length; i++) {
       ctx.fillText(titleText[i], cx / scaleX, 0);
       cx += (ctx.measureText(titleText[i]).width + ls) * scaleX;
     }
     ctx.restore();
     
     startY += titleHeightSpace;
  }
  
  const page = pages[currentPage];
  if (!page) return;
  
  page.forEach((ln, lIdx) => {
    let lnWidth = ln.reduce((s, e) => s + (e.text === '\n' ? 0 : e.w), 0);
    let y = startY + ln.yOffset;
    
    if (ln.length > 0 && ln[ln.length-1].text === ' ') lnWidth -= ln[ln.length-1].w;
    
    let x = mx;
    let justifySpace = 0;
    
    if (align === 'center') x = mx + (contentWidth - lnWidth)/2;
    else if (align === 'right') x = mx + contentWidth - lnWidth;
    else if (align === 'justify' && lIdx !== page.length-1 && lnWidth > 0 && ln.length > 1) {
      const isParaEnd = (lIdx < page.length - 1 && page[lIdx+1].length === 0) || (ln.length > 0 && ln[ln.length-1].text === '\n');
      if (!isParaEnd) {
        let spaces = 0;
        if (lineBreakModeEl.value === 'char') spaces = ln.length - (ln[ln.length-1].text === '\n' ? 2 : 1);
        else ln.forEach(e => { if(e.text === ' ') spaces++; });
        if (spaces > 0) justifySpace = (contentWidth - lnWidth) / spaces;
      }
    }
    
    ln.forEach(data => {
      if (data.text === '\n') return;
      
      const fmt = data.format;
      ctx.font = getFontStr(fmt, size);
      
      if (fmt.highlightColor && !data.isPlaceholder) {
        ctx.fillStyle = fmt.highlightColor;
        ctx.fillRect(x, y - size*0.8, data.w + justifySpace, lh * 0.9);
      }
      
      ctx.save();
      if (data.isPlaceholder) ctx.fillStyle = '#cccccc';
      else if (fmt.inlineColor) ctx.fillStyle = fmt.inlineColor;
      else if (fmt.isQuote) ctx.fillStyle = quoteColor; 
      else if (fmt.isAsterisk) ctx.fillStyle = astColor;
      else ctx.fillStyle = baseColor;

      ctx.translate(x, y);
      ctx.scale(scaleX, 1);
      
      if (lineBreakModeEl.value === 'char') {
        ctx.fillText(data.text, 0, 0);
      } else {
        if (data.text !== ' ') {
           let cx = 0;
           for (let i=0; i<data.text.length; i++) {
             ctx.fillText(data.text[i], cx, 0);
             cx += ctx.measureText(data.text[i]).width + ls;
           }
        }
      }
      ctx.restore();
      
      if (fmt.underline && !data.isPlaceholder) {
        ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = Math.max(1, size * 0.05);
        ctx.beginPath(); ctx.moveTo(x, y + size*0.1); ctx.lineTo(x + data.w, y + size*0.1); ctx.stroke();
      }

      if (fmt.strike && !data.isPlaceholder) {
        ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = Math.max(1, size * 0.05);
        ctx.beginPath(); ctx.moveTo(x, y - size*0.25); ctx.lineTo(x + data.w, y - size*0.25); ctx.stroke();
      }
      
      x += data.w;
      if (justifySpace > 0) {
        if (lineBreakModeEl.value === 'char' || data.text === ' ') x += justifySpace;
      }
    });
  });
  
  const fixedPaddingRight = 50;
  const fixedPaddingBottom = 40;

  const src = sourceEl.value.trim() || sourceEl.getAttribute('placeholder');
  const srcSize = parseInt(sourceFontSizeEl.value, 10);
  ctx.font = `${FONT_DEFS['pretendard'].weights.regular} ${srcSize}px ${FONT_DEFS['pretendard'].css}`;
  
  if (!sourceEl.value.trim()) ctx.fillStyle = 'rgba(0,0,0,0.15)';
  else ctx.fillStyle = sourceColorEl.value;
  
  const tw = ctx.measureText(src).width;
  ctx.fillText(src, cWidth - fixedPaddingRight - tw, cHeight - fixedPaddingBottom);
}

const DEFAULT_PRESET_DATA = {
  canvasWidth: '800', heightMode: '4:5', canvasHeight: '1000', marginY: '70', marginX: '70',
  bgColor: '#ffffff', fontFamily: 'pretendard', lineBreakMode: 'word', align: 'left',
  weight: 'regular', textColor: '#000000', fontSize: '20', lineHeight: '150',
  paraSpacing: '0', letterSpacing: '-0.5', scaleX: '97', asteriskColor: '#777777',
  quoteColor: '#358AE8', sourceColor: '#666666', sourceFontSize: '13'
};

const PRESETS_KEY = 'canvas_app_multi_presets_v1';

function loadPresetsList() {
  const select = el('presetSelect');
  const currentSelected = select.value;
  select.innerHTML = '<option value="기본값">기본값</option>';
  
  try {
    const dataMap = JSON.parse(localStorage.getItem(PRESETS_KEY) || '{}');
    Object.keys(dataMap).forEach(name => {
      if (name !== '기본값') {
        const opt = document.createElement('option');
        opt.value = name; opt.textContent = name; select.appendChild(opt);
      }
    });
  } catch(e) {}

  if (currentSelected && Array.from(select.options).some(o => o.value === currentSelected)) select.value = currentSelected;
  else select.value = '기본값';
}

el('savePresetBtn').addEventListener('click', () => {
  const nameInput = el('presetNameInput');
  const name = nameInput.value.trim();
  if (!name) { alert('템플릿 이름을 입력해주세요.'); nameInput.focus(); return; }
  
  let dataMap = {};
  try { dataMap = JSON.parse(localStorage.getItem(PRESETS_KEY) || '{}'); } catch(e) {}

  dataMap[name] = {
    canvasWidth: canvasWidthEl.value, heightMode: heightModeEl.value, canvasHeight: canvasHeightEl.value,
    marginY: marginYEl.value, marginX: marginXEl.value, bgColor: bgColorEl.value,
    fontFamily: fontFamilyEl.value, lineBreakMode: lineBreakModeEl.value, align: alignEl.value,
    weight: weightEl.value, textColor: textColorEl.value, fontSize: fontSizeEl.value,
    lineHeight: lineHeightEl.value, paraSpacing: paraSpacingEl.value, letterSpacing: letterSpacingEl.value,
    scaleX: scaleXEl.value, asteriskColor: asteriskColorEl.value, quoteColor: quoteColorEl.value,
    sourceColor: sourceColorEl.value, sourceFontSize: sourceFontSizeEl.value
  };

  localStorage.setItem(PRESETS_KEY, JSON.stringify(dataMap));
  nameInput.value = ''; loadPresetsList(); el('presetSelect').value = name;
  alert(`"${name}" 템플릿이 저장되었습니다.`);
});

el('loadPresetBtn').addEventListener('click', () => {
  const name = el('presetSelect').value;
  if (!name) { alert('불러올 템플릿을 선택해주세요.'); return; }
  
  let data = null;
  if (name === '기본값') data = DEFAULT_PRESET_DATA;
  else {
    try { const dataMap = JSON.parse(localStorage.getItem(PRESETS_KEY) || '{}'); data = dataMap[name]; } catch(e) {}
  }

  if (!data) { alert('해당 템플릿을 찾을 수 없습니다.'); return; }
  
  canvasWidthEl.value = data.canvasWidth; heightModeEl.value = data.heightMode;
  customHeightWrap.style.display = (heightModeEl.value === 'custom') ? 'block' : 'none';
  canvasHeightEl.value = data.canvasHeight; marginYEl.value = data.marginY; el('marginYVal').textContent = marginYEl.value;
  marginXEl.value = data.marginX; el('marginXVal').textContent = marginXEl.value; bgColorEl.value = data.bgColor;
  fontFamilyEl.value = data.fontFamily; lineBreakModeEl.value = data.lineBreakMode; alignEl.value = data.align;
  weightEl.value = data.weight; textColorEl.value = data.textColor; fontSizeEl.value = data.fontSize;
  el('fontSizeVal').textContent = fontSizeEl.value; lineHeightEl.value = data.lineHeight; el('lineHeightVal').textContent = lineHeightEl.value;
  paraSpacingEl.value = data.paraSpacing; paraSpacingValEl.textContent = paraSpacingEl.value; letterSpacingEl.value = data.letterSpacing;
  el('letterSpacingVal').textContent = letterSpacingEl.value; scaleXEl.value = data.scaleX; el('scaleXVal').textContent = scaleXEl.value;
  asteriskColorEl.value = data.asteriskColor; quoteColorEl.value = data.quoteColor; sourceColorEl.value = data.sourceColor;
  sourceFontSizeEl.value = data.sourceFontSize; el('sourceFontSizeVal').textContent = sourceFontSizeEl.value;

  draw(); alert(`"${name}" 템플릿을 불러왔습니다.`);
});

el('deletePresetBtn').addEventListener('click', () => {
  const name = el('presetSelect').value;
  if (!name) { alert('삭제할 템플릿을 선택해주세요.'); return; }
  if (name === '기본값') { alert('기본값 템플릿은 삭제할 수 없습니다.'); return; }
  if (!confirm(`"${name}" 템플릿을 삭제하시겠습니까?`)) return;
  
  try {
    const dataMap = JSON.parse(localStorage.getItem(PRESETS_KEY) || '{}'); delete dataMap[name];
    localStorage.setItem(PRESETS_KEY, JSON.stringify(dataMap)); loadPresetsList(); alert('삭제되었습니다.');
  } catch(e) { alert('삭제 실패'); }
});

document.querySelectorAll('input[type="range"]').forEach(input => {
  if(input.id === 'canvasZoom') return; 
  input.addEventListener('input', (e) => {
    if (e.target.id === 'paraSpacing') paraSpacingValEl.textContent = e.target.value;
    else { const valSpan = el(e.target.id + 'Val'); if (valSpan) valSpan.textContent = e.target.value; }
    draw();
  });
});

[sourceEl, bgColorEl, textColorEl, lineBreakModeEl, weightEl, alignEl, sourceColorEl].forEach(item => {
  item.addEventListener('input', draw);
});

fontFamilyEl.addEventListener('change', async (e) => {
  const def = FONT_DEFS[e.target.value];
  if (def && def.name && document.fonts) {
    try {
      await document.fonts.load(`16px "${def.name}"`);
    } catch(err) {
      console.warn("폰트 로드 실패:", err);
    }
  }
  draw();
});

asteriskColorEl.addEventListener('input', () => { applyAutoFormat(); draw(); });
quoteColorEl.addEventListener('input', () => { applyAutoFormat(); draw(); });

['titleInput', 'titleFontSize', 'titleColor', 'titleAlign', 'titleWeight', 'titleSpacing'].forEach(id => {
  if(el(id)) el(id).addEventListener('input', draw);
});

prevBtn.addEventListener('click', () => { if(currentPage > 0) { currentPage--; draw(); } });
nextBtn.addEventListener('click', () => { 
  const p = computePages().pages.length; 
  if(currentPage < p - 1) { currentPage++; draw(); } 
});

el('copyBtn').addEventListener('click', () => {
  canvas.toBlob(blob => {
    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
      .then(() => alert('클립보드에 복사되었습니다.'))
      .catch(e => alert('복사실패: ' + e));
  });
});

el('downloadBtn').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = `page_${currentPage + 1}.png`;
  link.href = canvas.toDataURL();
  link.click();
});

const resizer = el('resizer');
const panelCol = el('panelCol');
let isResizing = false;

resizer.addEventListener('mousedown', () => {
  isResizing = true;
  resizer.classList.add('resizing');
  document.body.style.cursor = 'col-resize';
});

document.addEventListener('mousemove', (e) => {
  if (!isResizing) return;
  const newWidth = document.body.clientWidth - e.clientX;
  if (newWidth > 300 && newWidth < 800) panelCol.style.width = newWidth + 'px';
});

document.addEventListener('mouseup', () => {
  if (isResizing) {
    isResizing = false;
    resizer.classList.remove('resizing');
    document.body.style.cursor = 'default';
  }
});

window.addEventListener('load', () => { 
  loadPresetsList();
  updateZoom();
  draw(); 
});
</script>
</body>
</html>
